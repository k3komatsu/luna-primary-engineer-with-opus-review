interface:
  display_name: "Luna Primary Engineer"
  short_description: "Luna Max primary + foreground Opus review/panel + rare Sol/Astra escalation"
  default_prompt: "Use Luna Primary Engineer v6.6. Keep the existing Luna Max/Fast root as the Primary Engineer and default implementer with Ponytail FULL. Claude review and panel helpers use synchronous claude -p foreground calls only, with read-only tools and explicit result contracts. start and advance wait for completion; status and collect inspect stored result files; re-review and panel follow-up use fresh calls with prior result and delta files. Do not use asynchronous Claude execution, job registries, terminal-log collection, or conversation lifecycle state. Fall back to Luna Max review if Claude is unavailable. Use Luna workers only for real wall-clock parallelism, and Sol/Astra only for narrow unresolved high-leverage questions."
policy:
  allow_implicit_invocation: true
