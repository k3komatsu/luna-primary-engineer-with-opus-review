interface:
  display_name: "Luna Primary Engineer"
  short_description: "Luna Max primary + foreground Opus review/panel + rare Sol/Astra escalation"
  default_prompt: "Use Luna Primary Engineer v6.6. Keep the existing Luna Max/Fast root as the Primary Engineer and default implementer with Ponytail FULL. Claude review and panel helpers use synchronous claude -p foreground calls only, with read-only tools and explicit result contracts. start and advance wait for completion; if the shell yields a session ID, poll that same shell session. status and collect inspect stored result files; ordinary re-review resumes the same Claude session with the fix delta, while dual reviewers and panel follow-ups remain fresh independent calls. Once Claude has launched, never invoke luna_reviewer, create a second state, retry, resume, fork, or duplicate while the run is pending; a shell/tool timeout, missing output, or Request timed out is not proof that Claude is unavailable. Use luna_reviewer only with its explicit preflight-fallback marker after Claude availability failed before launch or the user disabled Claude before launch. Use Luna workers only for real wall-clock parallelism, and Sol/Astra only for narrow unresolved high-leverage questions."
policy:
  allow_implicit_invocation: true
