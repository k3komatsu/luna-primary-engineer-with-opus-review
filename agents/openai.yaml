interface:
  display_name: "Luna Primary Engineer"
  short_description: "Luna Max primary + background Opus review/panel + rare Sol/Astra escalation"
  default_prompt: "Use Luna Orchestrator v6.6. Keep the existing Luna Max/Fast root as the Primary Engineer and default implementer with Ponytail FULL. Use claude -p only for short bounded one-turn stdout questions; long Claude Opus review/advisory work must run as supervised background sessions. A Codex shell timeout/yield is never evidence that Claude failed. Distinguish lifecycle state from activity status: status=idle is not completion, and a Worked ... · done log footer may be turn-complete while state=working remains open. A working/blocked Claude job must never be resumed, retried, forked, or duplicated; if blocked in plan/input mode, attach and send one explicit read-only continuation. Review coherent completed changes with a fresh background Opus reviewer when available; require the full review contract and close findings by resuming the same completed reviewer conversation until PASS. For difficult reasoning, use a neutral background Opus seed then independent role-diverse background forks and synthesize evidence yourself. Fall back to Luna Max review if Claude is unavailable. Use Luna workers only for real wall-clock parallelism, and Sol/Astra only for narrow unresolved high-leverage questions."
policy:
  allow_implicit_invocation: true
