interface:
  display_name: "Luna Primary Engineer"
  short_description: "Luna Max primary + synchronous Opus review/panel + rare Sol/Astra escalation"
  default_prompt: "Use Luna Primary Engineer v6.8.0. Keep allow_implicit_invocation disabled and invoke this skill only when explicitly selected. Keep the existing Luna Max/Fast root as the Primary Engineer and default implementer with Ponytail FULL. Claude review and panel helpers use synchronous claude -p foreground calls with a designated result file, separate diagnostics, runner and Claude PID state, and worktree tmp/luna-primary-engineer/reviews storage. Expose Write only through the exact Edit(<result-path>) rule; keep generic Edit, Bash, notebook, and MCP tools unavailable, and use the framed safe handoff if path-scoped permission is unavailable. Never terminate a launched Opus process; use explicit background forms before launch when continuous waiting may be impossible. While a process is pending, never invoke luna_reviewer, create another state, retry, resume, fork, or duplicate. If runner and Claude PIDs are both gone without an adopted result, report process_gone_without_result, require user confirmation, and never relaunch automatically. If liveness is permission_denied or PROCESS_LIST_PERMISSION_REQUIRED=1, ps was sandbox-denied; obtain execution-permission escalation and rerun status without changing state. A different unknown liveness value is also inconclusive. After fixing findings, re-review in the same session without extra approval when finding importance, fix scope, or regression risk is high; skip only when all three are low and report focused checks. Network, CLI, result-contract, and process-loss reruns still require explicit approval. If Claude reports No conversation found, record claude_session_not_found, require confirmation, and start a new Opus review rather than retrying or falling back automatically. Keep reviewer-specific prompt files for review focus, priorities, and questions; the wrapper-owned output template controls formatting. If review text returns with a format mismatch, inspect RAW_REVIEW_RESULT_PATH and report the findings without adopting a verdict or rerunning Opus automatically. A real Opus call from a restricted Codex sandbox may require network-enabled command escalation before launch; authentication success alone does not prove API reachability. Use luna_reviewer only after preflight failure or user disablement before Claude launch. Use Luna workers only for real wall-clock parallelism, and Sol/Astra only for narrow unresolved high-leverage questions."
policy:
  allow_implicit_invocation: false
